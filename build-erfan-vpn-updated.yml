          class _PowerPainter extends CustomPainter {
            final double t;
            final Color color;
            final bool connected;
            final bool connecting;
            _PowerPainter(this.t, this.color, this.connected, this.connecting);

            @override
            void paint(Canvas canvas, Size s) {
              final c = Offset(s.width / 2, s.height / 2);
              final r = s.width / 2;
              final pulse = 0.5 + 0.5 * math.sin(t * 2 * math.pi);

              final faint = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = 1.2
                ..color = color.withOpacity(0.25);
              canvas.drawCircle(c, r * 0.97, faint);
              canvas.drawCircle(c, r * 0.88, faint..color = color.withOpacity(0.15));

              // درخشش
              canvas.drawCircle(
                c,
                r * 0.72,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 16
                  ..color = color.withOpacity(connected ? 0.35 + 0.2 * pulse : 0.22)
                  ..maskFilter = const ui.MaskFilter.blur(ui.BlurStyle.normal, 12),
              );

              // حلقه اصلی
              final ringRect = Rect.fromCircle(center: c, radius: r * 0.72);
              canvas.drawCircle(
                c,
                r * 0.72,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 9
                  ..shader = SweepGradient(
                    colors: [color, color.withOpacity(0.55), color],
                  ).createShader(ringRect),
              );

              // دیسک داخلی
              final inner = Rect.fromCircle(center: c, radius: r * 0.6);
              canvas.drawCircle(
                c,
                r * 0.6,
                Paint()
                  ..shader = const RadialGradient(
                    colors: [Color(0xFF0C1B38), Color(0xFF050B18)],
                  ).createShader(inner),
              );

              // قوس چرخان هنگام اتصال
              if (connecting) {
                canvas.drawArc(
                  Rect.fromCircle(center: c, radius: r * 0.84),
                  t * 2 * math.pi,
                  1.3,
                  false,
                  Paint()
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 4
                    ..strokeCap = StrokeCap.round
                    ..color = color,
                );
              }

              // آیکون پاور
              final icon = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = 9
                ..strokeCap = StrokeCap.round
                ..color = connected ? const Color(0xFF18C6FF) : color.withOpacity(0.9);
              canvas.drawArc(
                Rect.fromCircle(center: c, radius: r * 0.26),
                -math.pi / 2 + 0.65,
                2 * math.pi - 1.3,
                false,
                icon,
              );
              canvas.drawLine(Offset(c.dx, c.dy - r * 0.33), Offset(c.dx, c.dy - r * 0.03), icon);
            }

            @override
            bool shouldRepaint(covariant _PowerPainter old) => true;
          }

