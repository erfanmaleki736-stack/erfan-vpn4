            Widget _statsTab() {
              final dlNow = _dlHist.isEmpty ? 0.0 : _dlHist.last;
              final ulNow = _ulHist.isEmpty ? 0.0 : _ulHist.last;
              final pg = (_livePing ?? 0).toDouble();
              final best = _byLink(_bestLink());
              return ListView(
                padding: const EdgeInsets.fromLTRB(16, 8, 16, 24),
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(6, 10, 6, 10),
                    child: Text(tr('آمار', 'Stats'),
                        style: const TextStyle(fontSize: 32, fontWeight: FontWeight.w600)),
                  ),
                  _bigChart(tr('دانلود', 'Download'), _dlHist, cBlue, 'Mbps', dlNow),
                  _bigChart(tr('آپلود', 'Upload'), _ulHist, cPurple, 'Mbps', ulNow),
                  _bigChart(tr('پینگ زنده', 'Live ping'), _pgHist, cGreen, 'ms', pg,
                      decimals: 0),
                  Container(
                    margin: const EdgeInsets.symmetric(vertical: 6),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: cCardA,
                      borderRadius: BorderRadius.circular(22),
                      border: Border.all(color: cBlue.withOpacity(0.35)),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(tr('این نشست', 'This session'),
                            style: const TextStyle(
                                fontSize: 16, fontWeight: FontWeight.w600)),
                        const SizedBox(height: 10),
                        _kv(tr('مدت اتصال', 'Duration'),
                            _connected ? _status.duration : '—'),
                        _kv(tr('دانلود کل', 'Total download'),
                            _connected ? _fmt(_status.download) : '—'),
                        _kv(tr('آپلود کل', 'Total upload'),
                            _connected ? _fmt(_status.upload) : '—'),
                        const Divider(),
                        _kv(
                            tr('بهترین سرور', 'Best server'),
                            best == null
                                ? '—'
                                : '${_nameOf(best)}  (${_pings[best.link]} ms${_speeds[best.link] != null ? ', ${_speeds[best.link]!.toStringAsFixed(1)} Mbps' : ''})'),
                      ],
                    ),
                  ),
                ],
              );
            }

