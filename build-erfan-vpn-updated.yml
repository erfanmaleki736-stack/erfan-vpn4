          class SpeedTestPage extends StatefulWidget {
            final void Function(double)? onDownload;
            const SpeedTestPage({super.key, this.onDownload});
            @override
            State<SpeedTestPage> createState() => _SpeedState();
          }

          class _SpeedState extends State<SpeedTestPage> {
            bool _running = false;
            String _phase = '';
            int? _ping;
            double? _down;
            double? _up;
            String? _err;

            Future<void> _run() async {
              setState(() {
                _running = true;
                _ping = null;
                _down = null;
                _up = null;
                _err = null;
                _phase = tr('پینگ...', 'Ping...');
              });
              try {
                final times = <int>[];
                for (int i = 0; i < 3; i++) {
                  final sw = Stopwatch()..start();
                  await http
                      .get(Uri.parse('https://speed.cloudflare.com/__down?bytes=1'))
                      .timeout(const Duration(seconds: 8));
                  sw.stop();
                  times.add(sw.elapsedMilliseconds);
                }
                _ping = times.reduce((a, b) => a < b ? a : b);
                if (mounted) setState(() => _phase = tr('دانلود...', 'Download...'));

                final sw2 = Stopwatch()..start();
                final r = await http
                    .get(Uri.parse('https://speed.cloudflare.com/__down?bytes=8000000'))
                    .timeout(const Duration(seconds: 40));
                sw2.stop();
                _down = r.bodyBytes.length * 8 / 1e6 /
                    (math.max(sw2.elapsedMilliseconds, 1) / 1000.0);
                widget.onDownload?.call(_down!);
                if (mounted) setState(() => _phase = tr('آپلود...', 'Upload...'));

                final sw3 = Stopwatch()..start();
                await http
                    .post(Uri.parse('https://speed.cloudflare.com/__up'),
                        body: List<int>.filled(3000000, 65))
                    .timeout(const Duration(seconds: 40));
                sw3.stop();
                _up = 3000000 * 8 / 1e6 /
                    (math.max(sw3.elapsedMilliseconds, 1) / 1000.0);
              } catch (_) {
                _err = tr('تست کامل نشد. اینترنت یا اتصال رو بررسی کن.',
                    'The test did not finish. Check your internet or connection.');
              }
              if (mounted) setState(() => _running = false);
            }

            Widget _metric(String title, String value) {
              return Expanded(
                child: Container(
                  margin: const EdgeInsets.all(4),
                  padding: const EdgeInsets.symmetric(vertical: 18),
                  decoration: BoxDecoration(
                    color: cCard,
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(color: cBlue.withOpacity(0.35)),
                  ),
                  child: Column(
                    children: [
                      Text(value,
                          style: const TextStyle(
                              fontSize: 22, fontWeight: FontWeight.w700, color: cAccent)),
                      const SizedBox(height: 6),
                      Text(title, style: const TextStyle(color: Colors.white60)),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: cBg,
                appBar: AppBar(title: Text(tr('تست سرعت', 'Speed test'))),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      Row(
                        children: [
                          _metric(tr('پینگ', 'Ping'), _ping == null ? '—' : '$_ping ms'),
                          _metric(tr('دانلود', 'Download'),
                              _down == null ? '—' : '${_down!.toStringAsFixed(1)} Mbps'),
                          _metric(tr('آپلود', 'Upload'),
                              _up == null ? '—' : '${_up!.toStringAsFixed(1)} Mbps'),
                        ],
                      ),
                      const SizedBox(height: 24),
                      if (_running) Text(_phase),
                      if (_err != null)
                        Padding(
                          padding: const EdgeInsets.only(top: 8),
                          child: Text(_err!, style: const TextStyle(color: Colors.redAccent)),
                        ),
                      const SizedBox(height: 16),
                      SizedBox(
                        width: 200,
                        height: 50,
                        child: FilledButton(
                          onPressed: _running ? null : _run,
                          child: Text(tr('شروع تست', 'Start test')),
                        ),
                      ),
                      const Spacer(),
                      Text(
                        tr('برای تست سرعت خود VPN، اول وصل شو و بعد تست رو بزن. سرعت دانلود برای همون کانفیگ ذخیره می‌شه.',
                            'To test the VPN speed, connect first and run the test. The download speed is saved for that config.'),
                        textAlign: TextAlign.center,
                        style: const TextStyle(color: Colors.white60),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // ============================================================
