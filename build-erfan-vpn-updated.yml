          class SparkPainter extends CustomPainter {
            final List<double> data;
            final Color color;
            SparkPainter(this.data, this.color);

            @override
            void paint(Canvas canvas, Size s) {
              if (data.length < 2) {
                canvas.drawLine(
                  Offset(0, s.height * 0.8),
                  Offset(s.width, s.height * 0.8),
                  Paint()
                    ..color = color.withOpacity(0.5)
                    ..strokeWidth = 2,
                );
                return;
              }
              double maxV = 0.001;
              for (final v in data) {
                if (v > maxV) maxV = v;
              }
              final pts = <Offset>[];
              for (int i = 0; i < data.length; i++) {
                final x = s.width * i / (data.length - 1);
                final y = s.height - (data[i] / maxV) * s.height * 0.8 - s.height * 0.08;
                pts.add(Offset(x, y));
              }
              final path = Path()..moveTo(pts.first.dx, pts.first.dy);
              for (int i = 1; i < pts.length; i++) {
                final mid = Offset((pts[i - 1].dx + pts[i].dx) / 2, (pts[i - 1].dy + pts[i].dy) / 2);
                path.quadraticBezierTo(pts[i - 1].dx, pts[i - 1].dy, mid.dx, mid.dy);
              }
              path.lineTo(pts.last.dx, pts.last.dy);

              final fill = Path.from(path)
                ..lineTo(s.width, s.height)
                ..lineTo(0, s.height)
                ..close();
              canvas.drawPath(
                fill,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [color.withOpacity(0.35), color.withOpacity(0)],
                  ).createShader(Offset.zero & s),
              );
              canvas.drawPath(
                path,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 2.2
                  ..strokeCap = StrokeCap.round
                  ..color = color,
              );
            }

            @override
            bool shouldRepaint(covariant SparkPainter old) => true;
          }

