          class QrScanPage extends StatefulWidget {
            const QrScanPage({super.key});

            @override
            State<QrScanPage> createState() => _QrScanPageState();
          }

          class _QrScanPageState extends State<QrScanPage> {
            bool _done = false;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(title: const Text('QR')),
                body: Stack(
                  children: [
                    MobileScanner(
                      onDetect: (capture) {
                        if (_done) return;
                        for (final b in capture.barcodes) {
                          final v = b.rawValue;
                          if (v != null && v.isNotEmpty) {
                            _done = true;
                            Navigator.of(context).pop(v);
                            return;
                          }
                        }
                      },
                    ),
                    Center(
                      child: Container(
                        width: 250,
                        height: 250,
                        decoration: BoxDecoration(
                          border: Border.all(color: Colors.white, width: 3),
                          borderRadius: BorderRadius.circular(20),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          DART_EOF
          cat > app/pubspec.yaml <<'PUB_EOF'
          name: erfan
          description: ERFAN VPN - VPN config client.
          publish_to: "none"
          version: 4.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray: ^1.0.10
            shared_preferences: ^2.2.2
            http: ^1.2.0
            mobile_scanner: ^5.2.3

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUB_EOF

      - name: Patch Android settings
        working-directory: app/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ERFAN VPN"/' $M
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>/' $M
          for G in app/build.gradle.kts app/build.gradle; do
            if [ -f "$G" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
              if [ "$G" = "app/build.gradle.kts" ]; then
                sed -i '0,/^android {/s//android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' "$G"
              else
                sed -i '0,/^android {/s//android {\n    packagingOptions { jniLibs { useLegacyPackaging = true } }/' "$G"
              fi
            fi
          done
          cat $M

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: ERFAN-apk
          path: app/build/app/outputs/flutter-apk/*.apk
