name: Build ERFAN VPN
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project
        run: flutter create --org com.erfan --project-name erfan --platforms=android app

      - name: Write app code
        run: |
          rm -rf app/test
          cat > app/lib/main.dart <<'DART_EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math' as math;
          import 'dart:ui' as ui;

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_v2ray/flutter_v2ray.dart';
          import 'package:http/http.dart' as http;
          import 'package:mobile_scanner/mobile_scanner.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          // ============================================================
          //  ثابت‌ها، رنگ‌ها و زبان
          // ============================================================

          const appName = 'ERFAN VPN';

          const cBg = Color(0xFF030814);
          const cCard = Color(0xFF0B1630);
          const cAccent = Color(0xFF18C6FF);
          const cBlue = Color(0xFF1E6BFF);
          const cPurple = Color(0xFF8B5CFF);
          const cGreen = Color(0xFF22E58F);
          const cSelected = Color(0xFF123A66);
          final cCardA = cCard.withOpacity(0.95);

          final ValueNotifier<String> langPref = ValueNotifier<String>('en');

          bool get isFa {
            final p = langPref.value;
            if (p == 'fa') return true;
            if (p == 'en') return false;
            return WidgetsBinding.instance.platformDispatcher.locale.languageCode == 'fa';
          }

          String tr(String fa, String en) => isFa ? fa : en;

          // ============================================================
          //  تنظیمات برنامه (ذخیره‌شده)
          // ============================================================

          class AppSettings {
            String lang = 'en';
            bool autoBest = true;
            bool autoSwitch = true;
            bool autoUpdate = true;
            bool autoSpeed = true;
            String ua = 'v2rayNG/1.8.5';
            bool proxyOnly = false;
            bool bypassLan = false;
            String dnsPreset = 'default';
            String dnsCustom = '';
            String domainStrategy = 'default';
            bool bypassIr = false;
            String directDomains = '';
            String blockDomains = '';
            String deviceId = '';

            Map<String, dynamic> toMap() => {
                  'lang': lang,
                  'autoBest': autoBest,
                  'autoSwitch': autoSwitch,
                  'autoUpdate': autoUpdate,
                  'autoSpeed': autoSpeed,
                  'ua': ua,
                  'proxyOnly': proxyOnly,
                  'bypassLan': bypassLan,
                  'dnsPreset': dnsPreset,
                  'dnsCustom': dnsCustom,
                  'domainStrategy': domainStrategy,
                  'bypassIr': bypassIr,
                  'directDomains': directDomains,
                  'blockDomains': blockDomains,
                  'deviceId': deviceId,
                };

            Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              final raw = p.getString('settings');
              if (raw != null) {
                try {
                  final m = jsonDecode(raw) as Map<String, dynamic>;
                  lang = (m['lang'] ?? lang) as String;
                  autoBest = (m['autoBest'] ?? autoBest) as bool;
                  autoSwitch = (m['autoSwitch'] ?? autoSwitch) as bool;
                  autoUpdate = (m['autoUpdate'] ?? autoUpdate) as bool;
                  autoSpeed = (m['autoSpeed'] ?? autoSpeed) as bool;
                  ua = (m['ua'] ?? ua) as String;
                  proxyOnly = (m['proxyOnly'] ?? proxyOnly) as bool;
                  bypassLan = (m['bypassLan'] ?? bypassLan) as bool;
                  dnsPreset = (m['dnsPreset'] ?? dnsPreset) as String;
                  dnsCustom = (m['dnsCustom'] ?? dnsCustom) as String;
                  domainStrategy = (m['domainStrategy'] ?? domainStrategy) as String;
                  bypassIr = (m['bypassIr'] ?? bypassIr) as bool;
                  directDomains = (m['directDomains'] ?? directDomains) as String;
                  blockDomains = (m['blockDomains'] ?? blockDomains) as String;
                  deviceId = (m['deviceId'] ?? deviceId) as String;
                } catch (_) {}
              }
              if (deviceId.isEmpty) {
                deviceId = _uuid();
                await save();
              }
              langPref.value = lang;
            }

            Future<void> save() async {
              final p = await SharedPreferences.getInstance();
              await p.setString('settings', jsonEncode(toMap()));
            }

            List<String> listOf(String s) => s
                .split(RegExp(r'[,\s]+'))
                .map((e) => e.trim().toLowerCase())
                .where((e) => e.isNotEmpty)
                .toList();

            List<String> dnsServers() {
              switch (dnsPreset) {
                case 'google':
                  return ['8.8.8.8', '8.8.4.4'];
                case 'cloudflare':
                  return ['1.1.1.1', '1.0.0.1'];
                case 'quad9':
                  return ['9.9.9.9', '149.112.112.112'];
                case 'adguard':
                  return ['94.140.14.14', '94.140.15.15'];
                case 'custom':
                  return dnsCustom
                      .split(RegExp(r'[,\s]+'))
                      .map((e) => e.trim())
                      .where((e) => e.isNotEmpty)
                      .toList();
                default:
                  return [];
              }
            }
          }

          final AppSettings S = AppSettings();

          String _uuid() {
            final r = math.Random.secure();
            final b = List<int>.generate(16, (_) => r.nextInt(256));
            b[6] = (b[6] & 0x0f) | 0x40;
            b[8] = (b[8] & 0x3f) | 0x80;
            String h(int i) => b[i].toRadixString(16).padLeft(2, '0');
            return '${h(0)}${h(1)}${h(2)}${h(3)}-${h(4)}${h(5)}-${h(6)}${h(7)}-${h(8)}${h(9)}-${h(10)}${h(11)}${h(12)}${h(13)}${h(14)}${h(15)}';
          }

          // ============================================================
          //  main
          // ============================================================

          Future<void> main() async {
            await runZonedGuarded(() async {
              WidgetsFlutterBinding.ensureInitialized();
              ErrorWidget.builder = (details) => Material(
                    color: Colors.black,
                    child: Center(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Text(details.exceptionAsString(),
                            style: const TextStyle(color: Colors.redAccent, fontSize: 12)),
                      ),
                    ),
                  );
              try {
                await S.load();
              } catch (_) {}
              runApp(const ErfanApp());
            }, (error, stack) {});
          }

          class ErfanApp extends StatelessWidget {
            const ErfanApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: appName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  colorScheme: ColorScheme.fromSeed(
                          seedColor: cBlue, brightness: Brightness.dark)
                      .copyWith(primary: cAccent),
                  scaffoldBackgroundColor: cBg,
                  navigationBarTheme: const NavigationBarThemeData(
                    backgroundColor: Color(0xFF040A1A),
                    indicatorColor: Color(0x331E6BFF),
                    elevation: 0,
                  ),
                ),
                builder: (context, child) => ValueListenableBuilder<String>(
                  valueListenable: langPref,
                  builder: (_, __, ___) => Directionality(
                    textDirection: isFa ? TextDirection.rtl : TextDirection.ltr,
                    child: child!,
                  ),
                ),
                home: const HomePage(),
              );
            }
          }

          // ============================================================
          //  مدل‌ها
          // ============================================================

          class Cfg {
            final String link; // لینک کانفیگ یا متن JSON کامل
            final String? sub; // آدرس ساب (اگه از ساب اومده)
            Cfg(this.link, this.sub);

            bool get isJson => link.startsWith('{');

            Map<String, dynamic> toJson() => {'l': link, 's': sub};
            factory Cfg.fromJson(Map<String, dynamic> j) =>
                Cfg(j['l'] as String, j['s'] as String?);
          }

          class SubInfo {
            String name;
            int used;
            int total;
            int expire; // epoch seconds
            SubInfo({this.name = '', this.used = 0, this.total = 0, this.expire = 0});

            Map<String, dynamic> toJson() =>
                {'n': name, 'u': used, 't': total, 'e': expire};
            factory SubInfo.fromJson(Map<String, dynamic> j) => SubInfo(
                  name: (j['n'] ?? '') as String,
                  used: (j['u'] ?? 0) as int,
                  total: (j['t'] ?? 0) as int,
                  expire: (j['e'] ?? 0) as int,
                );
          }

          class CfgGroup {
            final String? sub;
            final String title;
            final List<Cfg> items;
            CfgGroup(this.sub, this.title, this.items);
          }

          class SubRow {
            final String title;
            final int count;
            final int used;
            final int total;
            final int expire;
            SubRow(this.title, this.count, this.used, this.total, this.expire);
          }

          String _gb(int b) => '${(b / 1073741824).toStringAsFixed(1)} GB';

          int? _daysLeft(int expire) {
            if (expire <= 0) return null;
            final ms = expire * 1000 - DateTime.now().millisecondsSinceEpoch;
            return (ms / 86400000).ceil();
          }

          // ============================================================
          //  Home
          // ============================================================

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> with WidgetsBindingObserver {
            late final FlutterV2ray _v2ray;
            V2RayStatus _status = V2RayStatus();

            int _tab = 0; // 0 خانه، 1 سرورها، 2 آمار، 3 تنظیمات

            List<Cfg> _configs = [];
            List<String> _subs = [];
            final Map<String, SubInfo> _subInfo = {};
            final Map<String, int> _pings = {};
            final Map<String, double> _speeds = {}; // سرعت دانلود واقعی (Mbps)
            final Map<String, String> _names = {};
            final Map<String, String> _hosts = {};
            final Map<String, String> _custom = {};
            final Set<String> _collapsed = {};
            final Set<String> _busyPing = {};
            final Set<String> _busyUpd = {};
            List<Object> _rows = [];
            String? _selected;
            int _sort = 0; // 0 هوشمند، 1 پینگ، 2 سرعت، 3 نام، 4 پیش‌فرض

            bool _updatingSubs = false;
            bool _pinging = false;
            bool _foreground = true;
            bool _firstRound = true;
            bool _scanning = false;
            String _scanMsg = '';
            int _failRounds = 0;
            DateTime _lastSubUpdate = DateTime.fromMillisecondsSinceEpoch(0);
            Timer? _pingTimer;
            Timer? _liveTimer;

            // آمار زنده
            final List<double> _dlHist = [];
            final List<double> _ulHist = [];
            final List<double> _pgHist = [];
            int _prevDl = 0;
            int _prevUl = 0;
            DateTime? _prevT;
            int? _livePing;

            bool get _connected => _status.state == 'CONNECTED';
            bool get _connecting => _status.state == 'CONNECTING';

            static const _prefixes = [
              'vmess://',
              'vless://',
              'trojan://',
              'ss://',
              'socks://',
            ];
            bool _isLink(String s) => _prefixes.any(s.startsWith);

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              langPref.addListener(_onLang);
              _v2ray = FlutterV2ray(onStatusChanged: _onStatus);
              _init();
            }

            void _onLang() {
              if (mounted) setState(() {});
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              langPref.removeListener(_onLang);
              _pingTimer?.cancel();
              _liveTimer?.cancel();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _foreground = true;
                if (S.autoUpdate &&
                    DateTime.now().difference(_lastSubUpdate).inSeconds > 30) {
                  _updateAllSubs();
                } else {
                  _pingAll();
                }
              } else if (state == AppLifecycleState.paused ||
                  state == AppLifecycleState.inactive ||
                  state == AppLifecycleState.detached) {
                _foreground = false;
                _save(); // هر بار برنامه بسته یا مخفی شد، ذخیره کن
              }
            }

            // ---------- وضعیت اتصال و آمار زنده ----------

            void _push(List<double> l, double v) {
              l.add(v);
              if (l.length > 40) l.removeAt(0);
            }

            void _onStatus(V2RayStatus s) {
              final was = _status.state;
              _status = s;
              if (s.state == 'CONNECTED') {
                final now = DateTime.now();
                if (_prevT == null) {
                  _prevDl = s.download;
                  _prevUl = s.upload;
                  _prevT = now;
                } else {
                  final dt = now.difference(_prevT!).inMilliseconds / 1000.0;
                  if (dt > 0.3) {
                    final dl = math.max(0, s.download - _prevDl) * 8 / 1e6 / dt;
                    final ul = math.max(0, s.upload - _prevUl) * 8 / 1e6 / dt;
                    _push(_dlHist, dl);
                    _push(_ulHist, ul);
                    _prevDl = s.download;
                    _prevUl = s.upload;
                    _prevT = now;
                  }
                }
              } else {
                _prevT = null;
              }
              if (mounted) setState(() {});
              if (was != 'CONNECTED' && s.state == 'CONNECTED') _onConnected();
              if (was == 'CONNECTED' && s.state != 'CONNECTED') _onDisconnected();
            }

            void _onConnected() {
              _dlHist.clear();
              _ulHist.clear();
              _pgHist.clear();
              _liveTimer?.cancel();
              _liveTimer = Timer.periodic(const Duration(seconds: 5), (_) => _liveTick());
              _liveTick();
              if (S.autoSpeed && !_scanning) {
                Future.delayed(const Duration(seconds: 3), _autoSpeed);
              }
            }

            void _onDisconnected() {
              _liveTimer?.cancel();
              _livePing = null;
            }

            Future<void> _liveTick() async {
              if (!_connected) return;
              final sw = Stopwatch()..start();
              try {
                await http
                    .get(Uri.parse('https://www.gstatic.com/generate_204'))
                    .timeout(const Duration(seconds: 4));
                sw.stop();
                _livePing = sw.elapsedMilliseconds;
                _push(_pgHist, _livePing!.toDouble());
              } catch (_) {
                _livePing = null;
              }
              if (mounted) setState(() {});
            }

            Future<double?> _measureDown({int bytes = 3000000, int timeout = 15}) async {
              try {
                final sw = Stopwatch()..start();
                final r = await http
                    .get(Uri.parse('https://speed.cloudflare.com/__down?bytes=$bytes'))
                    .timeout(Duration(seconds: timeout));
                sw.stop();
                if (r.statusCode != 200 || r.bodyBytes.isEmpty) return null;
                return r.bodyBytes.length * 8 / 1e6 /
                    (math.max(sw.elapsedMilliseconds, 1) / 1000.0);
              } catch (_) {
                return null;
              }
            }

            Future<void> _autoSpeed() async {
              if (!_connected || _selected == null || _scanning) return;
              final link = _selected!;
              final sp = await _measureDown(bytes: 2000000, timeout: 12);
              if (sp != null) {
                _speeds[link] = sp;
                _resort();
                _save();
                if (mounted) setState(() {});
              }
            }

            void _saveSpeedFromTest(double v) {
              if (_connected && _selected != null) {
                _speeds[_selected!] = v;
                _resort();
                _save();
                if (mounted) setState(() {});
              }
            }

            // ---------- راه‌اندازی ----------

            Future<void> _init() async {
              // اول کانفیگ‌های ذخیره‌شده رو بخون، قبل از هر چیز دیگه
              try {
                await _load();
              } catch (_) {}

              try {
                await _v2ray.initializeV2Ray();
              } catch (e) {
                _toast('V2Ray: $e');
              }

              if (_subs.isNotEmpty && S.autoUpdate) {
                await _updateAllSubs(); // آخرش خودش پینگ می‌گیره
              } else {
                _pingAll();
              }

              _pingTimer = Timer.periodic(const Duration(minutes: 1), (_) {
                if (_foreground) _pingAll();
              });
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              List<Cfg> list = [];
              final raw = p.getString('configs');
              if (raw != null) {
                try {
                  list = (jsonDecode(raw) as List)
                      .map((e) => Cfg.fromJson(e as Map<String, dynamic>))
                      .toList();
                } catch (_) {}
              }
              final infoRaw = p.getString('subinfo');
              if (infoRaw != null) {
                try {
                  final m = jsonDecode(infoRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    _subInfo[k] = SubInfo.fromJson(Map<String, dynamic>.from(v as Map));
                  });
                } catch (_) {}
              }
              final custRaw = p.getString('custom');
              if (custRaw != null) {
                try {
                  final m = jsonDecode(custRaw) as Map<String, dynamic>;
                  m.forEach((k, v) => _custom[k] = v.toString());
                } catch (_) {}
              }
              final spRaw = p.getString('speeds');
              if (spRaw != null) {
                try {
                  final m = jsonDecode(spRaw) as Map<String, dynamic>;
                  m.forEach((k, v) => _speeds[k] = (v as num).toDouble());
                } catch (_) {}
              }
              if (!mounted) return;
              setState(() {
                _configs = list;
                _subs = p.getStringList('subs') ?? [];
                _selected = p.getString('selected');
                _sort = p.getInt('sort') ?? 0;
                if (_sort < 0 || _sort > 4) _sort = 0;
                if (_byLink(_selected) == null) {
                  _selected = _configs.isNotEmpty ? _configs.first.link : null;
                }
                _resort();
              });
            }

            Future<void> _save() async {
              final p = await SharedPreferences.getInstance();
              await p.setString(
                  'configs', jsonEncode(_configs.map((e) => e.toJson()).toList()));
              await p.setStringList('subs', _subs);
              await p.setString('subinfo',
                  jsonEncode(_subInfo.map((k, v) => MapEntry(k, v.toJson()))));
              await p.setString('custom', jsonEncode(_custom));
              await p.setString('speeds', jsonEncode(_speeds));
              await p.setInt('sort', _sort);
              if (_selected != null) {
                await p.setString('selected', _selected!);
              } else {
                await p.remove('selected');
              }
            }

            void _toast(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(msg)));
            }

            void _toggleLang() {
              S.lang = isFa ? 'en' : 'fa';
              langPref.value = S.lang;
              S.save();
              setState(() {});
            }

            // ---------- کمک‌ها ----------

            String _nameOf(Cfg c) {
              final cu = _custom[c.link];
              if (cu != null && cu.isNotEmpty) return cu;
              return _names.putIfAbsent(c.link, () {
                if (c.isJson) {
                  try {
                    final j = jsonDecode(c.link);
                    if (j is Map && j['remarks'] != null) return j['remarks'].toString();
                  } catch (_) {}
                  return 'JSON';
                }
                try {
                  final r = FlutterV2ray.parseFromURL(c.link).remark;
                  return r.isEmpty ? '—' : r;
                } catch (_) {
                  return '—';
                }
              });
            }

            String _rawHost(Cfg c) {
              try {
                if (c.isJson) {
                  final j = jsonDecode(c.link);
                  if (j is Map) {
                    final ob = j['outbounds'];
                    if (ob is List && ob.isNotEmpty) {
                      final s = ob[0]['settings'];
                      if (s is Map) {
                        final v = s['vnext'];
                        if (v is List && v.isNotEmpty) {
                          return (v[0]['address'] ?? '').toString();
                        }
                        final sv = s['servers'];
                        if (sv is List && sv.isNotEmpty) {
                          return (sv[0]['address'] ?? '').toString();
                        }
                      }
                    }
                  }
                  return '';
                }
                if (c.link.startsWith('vmess://')) {
                  final raw = c.link.substring(8).split('#').first;
                  final j = jsonDecode(utf8.decode(base64.decode(base64.normalize(raw))));
                  return (j['add'] ?? '').toString();
                }
                if (c.link.startsWith('ss://')) {
                  final u = Uri.tryParse(c.link);
                  if (u != null && u.host.isNotEmpty) return u.host;
                  final body = c.link.substring(5).split('#').first;
                  final dec = utf8.decode(base64.decode(base64.normalize(body)));
                  final at = dec.lastIndexOf('@');
                  if (at >= 0) return dec.substring(at + 1).split(':').first;
                  return '';
                }
                return Uri.tryParse(c.link)?.host ?? '';
              } catch (_) {
                return '';
              }
            }

            String _hostOf(Cfg c) => _hosts.putIfAbsent(c.link, () {
                  final h = _rawHost(c);
                  if (h.length <= 8) return h;
                  return '${h.substring(0, 4)}****${h.substring(h.length - 4)}';
                });

            String _fullConfig(Cfg c) => c.isJson
                ? c.link
                : FlutterV2ray.parseFromURL(c.link).getFullConfiguration();

            /// کانفیگ نهایی؛ اگه تنظیمات DNS و مسیر دست‌نخورده باشن، کانفیگ اصلی برمی‌گرده.
            String _buildConfig(Cfg c) {
              final base = _fullConfig(c);
              final needsDns = !c.isJson && S.dnsPreset != 'default';
              final needsRoute = S.domainStrategy != 'default' ||
                  S.bypassIr ||
                  S.directDomains.trim().isNotEmpty ||
                  S.blockDomains.trim().isNotEmpty;
              if (!needsDns && !needsRoute) return base;
              try {
                final decoded = jsonDecode(base);
                if (decoded is! Map) return base;
                final m = Map<String, dynamic>.from(decoded);
                if (needsDns) {
                  final servers = S.dnsServers();
                  if (servers.isNotEmpty) m['dns'] = {'servers': servers};
                }
                if (needsRoute) {
                  final outs = (m['outbounds'] is List)
                      ? List<dynamic>.from(m['outbounds'] as List)
                      : <dynamic>[];
                  bool hasTag(String t) => outs.any((o) => o is Map && o['tag'] == t);
                  final routing = (m['routing'] is Map)
                      ? Map<String, dynamic>.from(m['routing'] as Map)
                      : <String, dynamic>{};
                  final rules = (routing['rules'] is List)
                      ? List<dynamic>.from(routing['rules'] as List)
                      : <dynamic>[];
                  final front = <dynamic>[];
                  final direct = <String>[
                    ...S.listOf(S.directDomains).map((d) => 'domain:$d'),
                    if (S.bypassIr) 'domain:ir',
                  ];
                  final block = S.listOf(S.blockDomains).map((d) => 'domain:$d').toList();
                  if (direct.isNotEmpty) {
                    if (!hasTag('direct')) {
                      outs.add({'protocol': 'freedom', 'tag': 'direct', 'settings': {}});
                    }
                    front.add(
                        {'type': 'field', 'domain': direct, 'outboundTag': 'direct'});
                  }
                  if (block.isNotEmpty) {
                    if (!hasTag('block')) {
                      outs.add({'protocol': 'blackhole', 'tag': 'block', 'settings': {}});
                    }
                    front
                        .add({'type': 'field', 'domain': block, 'outboundTag': 'block'});
                  }
                  routing['rules'] = [...front, ...rules];
                  if (S.domainStrategy != 'default') {
                    routing['domainStrategy'] = S.domainStrategy;
                  }
                  m['routing'] = routing;
                  m['outbounds'] = outs;
                }
                return jsonEncode(m);
              } catch (_) {
                return base;
              }
            }

            Cfg? _byLink(String? link) {
              if (link == null) return null;
              for (final c in _configs) {
                if (c.link == link) return c;
              }
              return null;
            }

            String _subTitle(String url) {
              final n = _subInfo[url]?.name ?? '';
              if (n.isNotEmpty) return n;
              return Uri.tryParse(url)?.host ?? url;
            }

            /// امتیاز هوشمند: هرچی کمتر بهتر. پینگ واقعی منهای پاداش سرعت واقعی.
            double _scoreOf(Cfg c) {
              final p = _pings[c.link] ?? 99999;
              final sp = _speeds[c.link] ?? 0.0;
              return p - 3.0 * math.min(sp, 100.0);
            }

            /// مرتب‌سازی و ساخت ردیف‌های لیست (فقط آخر هر دور پینگ و موقع تغییر لیست)
            void _resort() {
              final idx = <String, int>{
                for (int i = 0; i < _configs.length; i++) _configs[i].link: i,
              };
              int rank(Cfg c) {
                final p = _pings[c.link];
                if (p == null) return 1;
                if (p < 0) return 2;
                return 0;
              }

              int cmp(Cfg a, Cfg b) {
                int byIdx() => idx[a.link]!.compareTo(idx[b.link]!);
                if (_sort == 4) return byIdx();
                if (_sort == 3) {
                  final d = _nameOf(a).toLowerCase().compareTo(_nameOf(b).toLowerCase());
                  return d != 0 ? d : byIdx();
                }
                final ra = rank(a), rb = rank(b);
                if (ra != rb) return ra - rb;
                if (ra == 0) {
                  int d;
                  if (_sort == 0) {
                    d = _scoreOf(a).compareTo(_scoreOf(b));
                  } else if (_sort == 2) {
                    final sa = _speeds[a.link] ?? -1.0;
                    final sb = _speeds[b.link] ?? -1.0;
                    d = sb.compareTo(sa);
                    if (d == 0) d = _pings[a.link]!.compareTo(_pings[b.link]!);
                  } else {
                    d = _pings[a.link]!.compareTo(_pings[b.link]!);
                  }
                  if (d != 0) return d;
                }
                return byIdx();
              }

              final rows = <Object>[];
              final local = _configs.where((c) => c.sub == null).toList()..sort(cmp);
              rows.add(CfgGroup(null, 'Local', local));
              if (!_collapsed.contains('')) rows.addAll(local);
              for (final s in _subs) {
                final items = _configs.where((c) => c.sub == s).toList()..sort(cmp);
                rows.add(CfgGroup(s, _subTitle(s), items));
                if (!_collapsed.contains(s)) rows.addAll(items);
              }
              _rows = rows;
            }

            String? _bestLink() {
              String? best;
              double bs = double.infinity;
              for (final c in _configs) {
                final p = _pings[c.link];
                if (p != null && p > 0) {
                  final s = _scoreOf(c);
                  if (s < bs) {
                    bs = s;
                    best = c.link;
                  }
                }
              }
              return best;
            }

            // ---------- افزودن ----------

            Future<void> _handleInput(String input) async {
              final text = input.trim();
              if (text.isEmpty) return _toast(tr('چیزی پیدا نشد', 'Nothing found'));

              if (text.startsWith('{')) {
                try {
                  jsonDecode(text);
                  _addManual([text]);
                } catch (_) {
                  _toast(tr('JSON معتبر نیست', 'Invalid JSON'));
                }
                return;
              }

              final links = text.split(RegExp(r'[\r\n\s]+')).where(_isLink).toList();
              if (links.isNotEmpty) {
                _addManual(links);
                return;
              }

              if (text.startsWith('http://') || text.startsWith('https://')) {
                if (!_subs.contains(text)) _subs.add(text);
                await _save();
                await _updateOneSub(text);
                return;
              }
              _toast(tr('کانفیگ یا ساب معتبر نیست', 'Not a valid config or subscription'));
            }

            void _addManual(List<String> links) {
              int added = 0;
              for (final l in links) {
                if (!_configs.any((c) => c.link == l)) {
                  _configs.add(Cfg(l, null));
                  added++;
                }
              }
              _selected ??= _configs.isNotEmpty ? _configs.first.link : null;
              _resort();
              setState(() {});
              _save();
              _toast(tr('$added کانفیگ اضافه شد', '$added config(s) added'));
              _pingAll();
            }

            Future<void> _fromClipboard() async {
              final d = await Clipboard.getData('text/plain');
              await _handleInput(d?.text ?? '');
            }

