          bool _inPoly(double x, double y, List<List<double>> poly) {
            bool inside = false;
            for (int i = 0, j = poly.length - 1; i < poly.length; j = i++) {
              final xi = poly[i][0], yi = poly[i][1];
              final xj = poly[j][0], yj = poly[j][1];
              final hit = ((yi > y) != (yj > y)) &&
                  (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
              if (hit) inside = !inside;
            }
            return inside;
          }

          class AppBackdrop extends StatefulWidget {
            const AppBackdrop({super.key});

            @override
            State<AppBackdrop> createState() => _AppBackdropState();
          }

          class _AppBackdropState extends State<AppBackdrop> {
            late final List<Offset> _dots;

            @override
            void initState() {
              super.initState();
              final d = <Offset>[];
              for (double lon = -170; lon <= 180; lon += 3) {
                for (double lat = 78; lat >= -56; lat -= 3) {
                  bool land = false;
                  for (final p in _landPolys) {
                    if (_inPoly(lon, lat, p)) {
                      land = true;
                      break;
                    }
                  }
                  if (land) d.add(Offset((lon + 170) / 350, (78 - lat) / 134));
                }
              }
              _dots = d;
            }

            @override
            Widget build(BuildContext context) {
              return RepaintBoundary(
                child: CustomPaint(painter: _BackdropPainter(_dots), size: Size.infinite),
              );
            }
          }

          class _BackdropPainter extends CustomPainter {
            final List<Offset> dots;
            _BackdropPainter(this.dots);

            @override
            void paint(Canvas canvas, Size s) {
              final rect = Offset.zero & s;
              canvas.drawRect(
                rect,
                Paint()
                  ..shader = const LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF020511), Color(0xFF050D24), Color(0xFF030814)],
                  ).createShader(rect),
              );

              // درخشش آبی بالای صفحه
              final glowC = Offset(s.width / 2, s.height * 0.3);
              canvas.drawCircle(
                glowC,
                s.width * 0.9,
                Paint()
                  ..shader = RadialGradient(
                    colors: [cBlue.withOpacity(0.16), cBlue.withOpacity(0)],
                  ).createShader(Rect.fromCircle(center: glowC, radius: s.width * 0.9)),
              );

              // نقشه نقطه‌ای کم‌رنگ
              final mapH = s.width * 134 / 350;
              final top = s.height * 0.03;
              final p = Paint()..color = const Color(0x3A3E8CFF);
              for (final o in dots) {
                canvas.drawCircle(Offset(o.dx * s.width, top + o.dy * mapH), 1.2, p);
              }

              // حلقه‌های محو دور دکمه
              final ringP = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = 1
                ..color = const Color(0x221E6BFF);
              final c = Offset(s.width / 2, s.height * 0.4);
              for (final r in [0.55, 0.7, 0.9]) {
                canvas.drawOval(
                    Rect.fromCenter(center: c, width: s.width * r * 1.6, height: s.width * r * 0.9),
                    ringP);
              }
            }

            @override
            bool shouldRepaint(covariant _BackdropPainter old) => false;
          }

